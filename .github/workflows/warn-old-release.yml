name: Warn Old Release

# 用途：给历史遗留的、不含流量修复补丁的 release 正文追加警告注记（可批量）。
# 为什么用 Actions 而不是本地 token：MCP 的 OAuth token 对 releases 无写权限（403），
# 而仓库自带的 GITHUB_TOKEN 具备 contents:write，可安全完成该操作。
#
# 触发：修改本文件被推送到仓库时自动触发，或在 Actions 页面手动 workflow_dispatch。
# 幂等：正文已含警告特征词则跳过；tag 不存在则告警跳过（不中断批次）。
# 待处理的 tag 清单在下方 TAGS（如有新的历史版本需要挂警告，直接加进列表即可）。

on:
  push:
    paths:
      - '.github/workflows/warn-old-release.yml'
      - 'docs/release-warnings/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 给历史 release 追加「不含流量修复」警告（幂等）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER="不含流量修复"
          WARN_FILE="docs/release-warnings/no-traffic-fix.md"
          TAGS="dev-v0.3.2-selfbuild2 dev-v0.3.2-selfbuild continuous"
          ok=0; skip=0; miss=0
          for TAG in $TAGS; do
            if ! OLD=$(gh release view "$TAG" --repo "$REPO" --json body -q .body 2>/dev/null); then
              echo "::warning::未找到 release $TAG，跳过"
              miss=$((miss+1)); continue
            fi
            if grep -q "$MARKER" <<< "$OLD"; then
              echo "✅ $TAG：警告已存在，跳过（幂等）"
              skip=$((skip+1)); continue
            fi
            { cat "$WARN_FILE"; printf '\n---\n\n'; printf '%s\n' "$OLD"; } > /tmp/new-body.md
            gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/new-body.md
            echo "✅ $TAG：已写入警告注记"
            ok=$((ok+1))
          done
          echo "----- 汇总：写入 $ok / 已存在 $skip / 未找到 $miss -----"
          echo "当前 Latest 指向：$(gh release view --repo "$REPO" --json tagName -q .tagName)"
